services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: longriver
      POSTGRES_USER: longriver
      POSTGRES_PASSWORD: longriver-local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U longriver -d longriver"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - longriver-postgres:/var/lib/postgresql/data

volumes:
  longriver-postgres:
